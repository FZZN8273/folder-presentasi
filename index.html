<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PELITA presentasi LKIP XIII 2026</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --hijau: #2E8B57;
            --hijau-dark: #1f5f3c;
            --emas: #D4AF37;
            --krem: #FFF8DC;
            --dark: #1A1410;
            --light: #FDFCF8;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Nunito', sans-serif;
            background: #0a0a0a;
        }

        /* ===== SLIDESHOW CONTAINER ===== */
        .slideshow {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(ellipse at center, #1a1a1a 0%, #0a0a0a 100%);
            overflow: hidden;
        }

        /* ===== SLIDE ===== */
        .slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transform: scale(0.95) translateY(20px);
            transition: all 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            pointer-events: none;
            padding: 40px;
        }

        .slide.active {
            opacity: 1;
            transform: scale(1) translateY(0);
            pointer-events: auto;
            z-index: 10;
        }

        .slide.prev {
            transform: scale(0.9) translateY(-30px);
        }

        .slide img {
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
            object-fit: contain;
            border-radius: 12px;
            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.6),
                0 0 0 1px rgba(212, 175, 55, 0.3),
                0 0 80px rgba(46, 139, 87, 0.15);
            animation: slideIn 0.9s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: scale(0.92) rotateY(8deg);
                filter: blur(4px);
            }
            to {
                opacity: 1;
                transform: scale(1) rotateY(0deg);
                filter: blur(0);
            }
        }

        /* ===== FLOATING LOGO ===== */
        .brand {
            position: fixed;
            top: 20px;
            left: 25px;
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 100;
            opacity: 0.8;
            transition: opacity 0.3s;
        }

        .brand:hover {
            opacity: 1;
        }

        .brand-icon {
            font-size: 24px;
            filter: drop-shadow(0 0 8px rgba(212, 175, 55, 0.6));
        }

        .brand-text {
            color: var(--emas);
            font-weight: 800;
            font-size: 14px;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(212, 175, 55, 0.4);
        }

        /* ===== SLIDE COUNTER ===== */
        .counter {
            position: fixed;
            top: 20px;
            right: 25px;
            color: var(--emas);
            font-weight: 800;
            font-size: 14px;
            background: rgba(26, 20, 16, 0.85);
            padding: 8px 18px;
            border-radius: 30px;
            border: 1px solid rgba(212, 175, 55, 0.4);
            backdrop-filter: blur(10px);
            z-index: 100;
            letter-spacing: 1px;
        }

        .counter .current {
            color: #fff;
            font-size: 16px;
        }

        /* ===== NAVIGATION BUTTONS ===== */
        .nav-btn {
            position: fixed;
            top: 50%;
            transform: translateY(-50%);
            width: 55px;
            height: 55px;
            background: rgba(26, 20, 16, 0.7);
            border: 2px solid rgba(212, 175, 55, 0.4);
            border-radius: 50%;
            color: var(--emas);
            font-size: 24px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            user-select: none;
        }

        .nav-btn:hover {
            background: var(--emas);
            color: var(--hijau-dark);
            transform: translateY(-50%) scale(1.1);
            box-shadow: 0 0 25px rgba(212, 175, 55, 0.6);
        }

        .nav-btn:active {
            transform: translateY(-50%) scale(0.95);
        }

        .nav-btn.prev {
            left: 20px;
        }

        .nav-btn.next {
            right: 20px;
        }

        .nav-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        /* ===== PROGRESS BAR ===== */
        .progress-container {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: rgba(255, 255, 255, 0.05);
            z-index: 100;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--hijau), var(--emas));
            width: 0%;
            transition: width 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.6);
        }

        /* ===== THUMBNAIL OVERVIEW ===== */
        .thumbnails {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(120%);
            display: flex;
            gap: 8px;
            padding: 12px 18px;
            background: rgba(26, 20, 16, 0.9);
            border-radius: 16px;
            border: 1px solid rgba(212, 175, 55, 0.3);
            backdrop-filter: blur(15px);
            z-index: 99;
            transition: transform 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            max-width: 90vw;
            overflow-x: auto;
        }

        .thumbnails.show {
            transform: translateX(-50%) translateY(0);
        }

        .thumb {
            width: 50px;
            height: 32px;
            border-radius: 6px;
            overflow: hidden;
            cursor: pointer;
            opacity: 0.5;
            transition: all 0.3s ease;
            flex-shrink: 0;
            border: 2px solid transparent;
        }

        .thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .thumb:hover {
            opacity: 1;
            transform: scale(1.15);
        }

        .thumb.active {
            opacity: 1;
            border-color: var(--emas);
            box-shadow: 0 0 12px rgba(212, 175, 55, 0.7);
        }

        /* ===== HINT ===== */
        .hint {
            position: fixed;
            bottom: 20px;
            left: 25px;
            color: rgba(255, 255, 255, 0.4);
            font-size: 12px;
            z-index: 100;
            transition: opacity 0.5s;
            font-weight: 600;
        }

        .hint.hide {
            opacity: 0;
        }

        /* ===== FULLSCREEN TOGGLE ===== */
        .fullscreen-btn {
            position: fixed;
            bottom: 20px;
            right: 25px;
            width: 42px;
            height: 42px;
            background: rgba(26, 20, 16, 0.7);
            border: 2px solid rgba(212, 175, 55, 0.4);
            border-radius: 50%;
            color: var(--emas);
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }

        .fullscreen-btn:hover {
            background: var(--emas);
            color: var(--hijau-dark);
            transform: scale(1.1);
        }

        /* ===== LOADING ===== */
        .loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0a0a0a;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.6s ease;
        }

        .loading.hide {
            opacity: 0;
            pointer-events: none;
        }

        .loading-content {
            text-align: center;
            color: var(--emas);
        }

        .loading-icon {
            font-size: 60px;
            margin-bottom: 20px;
            animation: flicker 1.5s infinite;
        }

        @keyframes flicker {
            0%, 100% { opacity: 1; filter: drop-shadow(0 0 20px rgba(212, 175, 55, 0.8)); }
            50% { opacity: 0.6; filter: drop-shadow(0 0 40px rgba(212, 175, 55, 1)); }
        }

        .loading-text {
            font-weight: 800;
            letter-spacing: 3px;
            font-size: 16px;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            .slide { padding: 15px; }
            .nav-btn { width: 42px; height: 42px; font-size: 18px; }
            .nav-btn.prev { left: 10px; }
            .nav-btn.next { right: 10px; }
            .brand-text { display: none; }
            .counter { font-size: 12px; padding: 6px 12px; }
            .thumbnails { gap: 5px; padding: 8px 12px; }
            .thumb { width: 40px; height: 26px; }
            .hint { display: none; }
        }
    </style>
</head>
<body>

    <!-- LOADING -->
    <div class="loading" id="loading">
        <div class="loading-content">
            <div class="loading-icon">🕯️</div>
            <div class="loading-text">MEMUAT PELITA...</div>
        </div>
    </div>

    <!-- SLIDESHOW -->
    <div class="slideshow" id="slideshow">

        <!-- SLIDE 1 -->
        <div class="slide active" data-index="0">
            <img src="pelita1.jpg" alt="Slide 1 — Judul" draggable="false">
        </div>

        <!-- SLIDE 2 -->
        <div class="slide" data-index="1">
            <img src="pelita2.jpg" alt="Slide 2 — Mengapa PELITA?" draggable="false">
        </div>

        <!-- SLIDE 3 -->
        <div class="slide" data-index="2">
            <img src="pelita3.jpg" alt="Slide 3 — Celah Penelitian" draggable="false">
        </div>

        <!-- SLIDE 4 -->
        <div class="slide" data-index="3">
            <img src="pelita4.jpg" alt="Slide 4 — Solusi PELITA" draggable="false">
        </div>

        <!-- SLIDE 5 -->
        <div class="slide" data-index="4">
            <img src="pelita5.jpg" alt="Slide 5 — Tiga Keunggulan" draggable="false">
        </div>

        <!-- SLIDE 6 -->
        <div class="slide" data-index="5">
            <img src="pelita6.jpeg" alt="Slide 6 — Cara Main" draggable="false">
        </div>

        <!-- SLIDE 7 -->
        <div class="slide" data-index="6">
            <img src="pelita7.jpg" alt="Slide 7 — Metode Penelitian" draggable="false">
        </div>

        <!-- SLIDE 8 -->
        <div class="slide" data-index="7">
            <img src="pelita8.jpg" alt="Slide 8 — Perbandingan" draggable="false">
        </div>

        <!-- SLIDE 9 -->
        <div class="slide" data-index="8">
            <img src="pelita9.jpeg" alt="Slide 9 — Hasil 12 Indikator" draggable="false">
        </div>

        <!-- SLIDE 10 -->
        <div class="slide" data-index="9">
            <img src="pelita10.jpg" alt="Slide 10 — Hasil Likert" draggable="false">
        </div>

        <!-- SLIDE 11 -->
        <div class="slide" data-index="10">
            <img src="pelita11.png" alt="Slide 11 — Mengapa PELITA Berhasil?" draggable="false">
        </div>

        <!-- SLIDE 12 -->
        <div class="slide" data-index="11">
            <img src="pelita12.jpeg" alt="Slide 12 — Kesimpulan" draggable="false">
        </div>

        <!-- SLIDE 13 -->
        <div class="slide" data-index="12">
            <img src="pelita13.jpeg" alt="Slide 13 — Arah Pengembangan" draggable="false">
        </div>

        <!-- SLIDE 14 -->
        <div class="slide" data-index="13">
            <img src="pelita14.jpeg" alt="Slide 14 — Penutup" draggable="false">
        </div>

    </div>

    <!-- BRAND -->
    <div class="brand">
        <div class="brand-icon">🕯️</div>
        <div class="brand-text">PELITA — LKIP XIII 2026</div>
    </div>

    <!-- COUNTER -->
    <div class="counter">
        <span class="current" id="currentSlide">1</span> / <span id="totalSlides">14</span>
    </div>

    <!-- NAVIGATION -->
    <button class="nav-btn prev" id="prevBtn" onclick="prevSlide()" aria-label="Slide sebelumnya">‹</button>
    <button class="nav-btn next" id="nextBtn" onclick="nextSlide()" aria-label="Slide berikutnya">›</button>

    <!-- FULLSCREEN -->
    <button class="fullscreen-btn" id="fullscreenBtn" onclick="toggleFullscreen()" aria-label="Fullscreen">⛶</button>

    <!-- HINT -->
    <div class="hint" id="hint">← → atau SPACE untuk navigasi</div>

    <!-- PROGRESS -->
    <div class="progress-container">
        <div class="progress-bar" id="progressBar"></div>
    </div>

    <!-- THUMBNAILS -->
    <div class="thumbnails" id="thumbnails"></div>

    <script>
        // ===== STATE =====
        let currentIndex = 0;
        const totalSlides = 14;
        const slides = document.querySelectorAll('.slide');
        const currentSlideEl = document.getElementById('currentSlide');
        const progressBar = document.getElementById('progressBar');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const hint = document.getElementById('hint');
        const thumbnails = document.getElementById('thumbnails');
        const loading = document.getElementById('loading');

        // Daftar nama file yang sesuai dengan folder
        const imageFiles = [
            'pelita1.jpeg', 'pelita2.jpeg', 'pelita3.jpeg', 'pelita4.jpeg',
            'pelita5.jpeg', 'pelita6.jpeg', 'pelita7.jpeg', 'pelita8.jpeg',
            'pelita9.jpeg', 'pelita10.jpeg', 'pelita11.png', 'pelita12.jpeg',
            'pelita13.jpeg', 'pelita14.jpeg'
        ];

        // ===== BUILD THUMBNAILS =====
        function buildThumbnails() {
            for (let i = 0; i < totalSlides; i++) {
                const thumb = document.createElement('div');
                thumb.className = 'thumb' + (i === 0 ? ' active' : '');
                thumb.onclick = () => goToSlide(i);
                thumb.innerHTML = `<img src="${imageFiles[i]}" alt="Slide ${i + 1}" draggable="false">`;
                thumbnails.appendChild(thumb);
            }
        }

        // ===== UPDATE SLIDE =====
        function updateSlide() {
            slides.forEach((slide, i) => {
                slide.classList.remove('active', 'prev');
                if (i === currentIndex) {
                    slide.classList.add('active');
                } else if (i < currentIndex) {
                    slide.classList.add('prev');
                }
            });

            // Counter
            currentSlideEl.textContent = currentIndex + 1;

            // Progress
            const progress = ((currentIndex + 1) / totalSlides) * 100;
            progressBar.style.width = progress + '%';

            // Thumbnails
            document.querySelectorAll('.thumb').forEach((thumb, i) => {
                thumb.classList.toggle('active', i === currentIndex);
            });

            // Navigation buttons
            prevBtn.disabled = currentIndex === 0;
            nextBtn.disabled = currentIndex === totalSlides - 1;

            // Scroll thumbnail into view
            const activeThumb = document.querySelector('.thumb.active');
            if (activeThumb) {
                activeThumb.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
            }
        }

        // ===== NAVIGATION =====
        function nextSlide() {
            if (currentIndex < totalSlides - 1) {
                currentIndex++;
                updateSlide();
            }
        }

        function prevSlide() {
            if (currentIndex > 0) {
                currentIndex--;
                updateSlide();
            }
        }

        function goToSlide(index) {
            if (index >= 0 && index < totalSlides) {
                currentIndex = index;
                updateSlide();
            }
        }

        // ===== KEYBOARD =====
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') {
                e.preventDefault();
                nextSlide();
            } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
                e.preventDefault();
                prevSlide();
            } else if (e.key === 'Home') {
                goToSlide(0);
            } else if (e.key === 'End') {
                goToSlide(totalSlides - 1);
            } else if (e.key === 'f' || e.key === 'F') {
                toggleFullscreen();
            } else if (e.key === 't' || e.key === 'T') {
                thumbnails.classList.toggle('show');
            }
        });

        // ===== MOUSE WHEEL =====
        let wheelTimeout;
        document.addEventListener('wheel', (e) => {
            clearTimeout(wheelTimeout);
            wheelTimeout = setTimeout(() => {
                if (e.deltaY > 0) nextSlide();
                else if (e.deltaY < 0) prevSlide();
            }, 50);
        }, { passive: true });

        // ===== TOUCH SWIPE =====
        let touchStartX = 0;
        let touchStartY = 0;
        document.addEventListener('touchstart', (e) => {
            touchStartX = e.changedTouches[0].screenX;
            touchStartY = e.changedTouches[0].screenY;
        }, { passive: true });

        document.addEventListener('touchend', (e) => {
            const touchEndX = e.changedTouches[0].screenX;
            const touchEndY = e.changedTouches[0].screenY;
            const diffX = touchStartX - touchEndX;
            const diffY = touchStartY - touchEndY;

            if (Math.abs(diffX) > Math.abs(diffY) && Math.abs(diffX) > 50) {
                if (diffX > 0) nextSlide();
                else prevSlide();
            }
        }, { passive: true });

        // ===== FULLSCREEN =====
        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    console.log('Fullscreen error:', err);
                });
            } else {
                document.exitFullscreen();
            }
        }

        // ===== HIDE HINT AFTER 5s =====
        setTimeout(() => {
            hint.classList.add('hide');
        }, 5000);

        // ===== THUMBNAILS TOGGLE WITH MOUSE MOVE =====
        let mouseMoveTimeout;
        document.addEventListener('mousemove', () => {
            clearTimeout(mouseMoveTimeout);
            thumbnails.classList.add('show');
            mouseMoveTimeout = setTimeout(() => {
                thumbnails.classList.remove('show');
            }, 3000);
        });

        // ===== INIT =====
        window.addEventListener('load', () => {
            buildThumbnails();
            updateSlide();

            setTimeout(() => {
                loading.classList.add('hide');
            }, 800);
        });

        // ===== PREVENT IMAGE DRAG =====
        document.addEventListener('dragstart', (e) => {
            if (e.target.tagName === 'IMG') e.preventDefault();
        });
    </script>
</body>
</html>
